[pytest]
testpaths = tests
addopts = --strict-markers -ra --reruns 1 --only-rerun "ConnectionError|Timeout|ChunkedEncodingError"
markers =
    smoke: fast, CI-safe subset (auth + one read per service)
    negative: expects the API to reject the request
    mutation: performs a write; skipped unless ALLOW_MUTATIONS=1 and the profile allows it
    schema: asserts response shape against a pydantic model
    known_bug: xfail(strict=True) — flips to XPASS (a real failure) once backend fixes it
